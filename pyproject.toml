[project]
name = "mlops-mcp-server"
version = "0.1.0"
description = "MLOps MCP Server with 12 Capabilities for automated machine learning operations"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core dependencies
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # Machine Learning
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",

    # Model Interpretability
    "shap>=0.44.0",
    "lime>=0.2.0",

    # Visualization (optional, for reports)
    "matplotlib>=3.8.0",

    # GitHub integration
    "PyGithub>=2.1.0",

    # MCP Server
    "mcp>=1.0.0",

    # Utilities
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
]

# Parquet support
parquet = [
    "pyarrow>=15.0.0",
]

# Deep learning (optional)
deep-learning = [
    "tensorflow>=2.15.0",
]

[tool.black]
# Black configuration for MLOps project
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.venv
  | venv
  | build
  | dist
  | cdk.out
)/
'''

[tool.isort]
# isort configuration for MLOps project
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".git", ".venv", "venv", "build", "dist", "cdk.out"]

[tool.pytest.ini_options]
# pytest configuration (alternative to pytest.ini)
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --disable-warnings"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
# mypy configuration for type checking
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
    "cdk.out/",
]

[tool.bandit]
# bandit configuration for security static analysis
exclude_dirs = ["tests", ".venv", "venv", "build", "dist"]
skips = ["B101", "B608"]  # B101: assert in tests, B608: false positive on Dockerfile f-strings

[tool.coverage.run]
# Coverage configuration
source = ["mcp_server"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
# Coverage reporting
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70
show_missing = true
